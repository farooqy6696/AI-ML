
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header>

    <h1>Student Management System</h1>

    <p>Manage Student Details</p>

</header>



<!-- =========================================================
     MAIN CONTAINER
========================================================= -->

<div class="container">


    <!-- =====================================================
         ADD STUDENT FORM
    ====================================================== -->

    <div class="form-box">

        <h2>Add Student</h2>


        <form id="studentForm">


            <!-- Student Name -->

            <label for="name">
                Student Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter Student Name"
                required
            >



            <!-- Email -->

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter Email"
                required
            >



            <!-- Phone -->

            <label for="phone">
                Phone
            </label>

            <input
                type="text"
                id="phone"
                placeholder="Enter Phone Number"
                required
            >



            <!-- Course -->

            <label for="course">
                Course
            </label>

            <select id="course" required>

                <option value="">
                    Select Course
                </option>

                <option value="B.Tech">
                    B.Tech
                </option>

                <option value="BCA">
                    BCA
                </option>

                <option value="MCA">
                    MCA
                </option>

                <option value="MBA">
                    MBA
                </option>

            </select>



            <!-- Department -->

            <label for="department">
                Department
            </label>

            <select id="department" required>

                <option value="">
                    Select Department
                </option>

                <option value="CSE">
                    CSE
                </option>

                <option value="ECE">
                    ECE
                </option>

                <option value="EEE">
                    EEE
                </option>

                <option value="MECH">
                    Mechanical
                </option>

                <option value="CIVIL">
                    Civil
                </option>

            </select>



            <!-- Year -->

            <label for="year">
                Year
            </label>

            <select id="year" required>

                <option value="">
                    Select Year
                </option>

                <option value="1st Year">
                    1st Year
                </option>

                <option value="2nd Year">
                    2nd Year
                </option>

                <option value="3rd Year">
                    3rd Year
                </option>

                <option value="4th Year">
                    4th Year
                </option>

            </select>



            <!-- Submit -->

            <button type="submit">
                Add Student
            </button>


        </form>

    </div>



    <!-- =====================================================
         STUDENT TABLE
    ====================================================== -->

    <div class="table-box">

        <h2>Student Details</h2>



        <!-- Search -->

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search Student..."
            >

            <button
                type="button"
                onclick="searchStudents()">

                Search

            </button>

        </div>



        <!-- Table -->

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Email</th>

                    <th>Phone</th>

                    <th>Course</th>

                    <th>Department</th>

                    <th>Year</th>

                    <th>Action</th>

                </tr>

            </thead>



            <tbody id="studentTable">

                <!-- Students will be displayed here -->

            </tbody>

        </table>


    </div>


</div>



<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script>


/* =========================================================
   GET HTML ELEMENTS
========================================================= */

const studentForm =
    document.getElementById("studentForm");

const studentTable =
    document.getElementById("studentTable");

const searchInput =
    document.getElementById("searchInput");



/* =========================================================
   ADD STUDENT
========================================================= */

studentForm.addEventListener(
    "submit",
    async function(event) {

        // Prevent page refresh
        event.preventDefault();


        // Get values from form

        const name =
            document.getElementById("name").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const phone =
            document.getElementById("phone").value.trim();

        const course =
            document.getElementById("course").value;

        const department =
            document.getElementById("department").value;

        const year =
            document.getElementById("year").value;



        // Create student object

        const student = {

            name: name,

            email: email,

            phone: phone,

            course: course,

            department: department,

            year: year

        };



        try {


            // Send student data to Flask

            const response = await fetch(
                "/api/students",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(student)
                }
            );



            const data =
                await response.json();



            // Check response

            if (!response.ok) {

                alert(
                    data.error ||
                    "Failed to add student"
                );

                return;
            }



            // Success message

            alert(
                "Student added successfully!"
            );



            // Clear form

            studentForm.reset();



            // Reload student list

            loadStudents();


        }

        catch (error) {

            console.error(
                "Error:",
                error
            );

            alert(
                "Unable to connect to Flask server."
            );

        }

    }
);



/* =========================================================
   LOAD ALL STUDENTS
========================================================= */

async function loadStudents() {

    try {


        // GET request

        const response =
            await fetch("/api/students");



        const students =
            await response.json();



        // Clear table

        studentTable.innerHTML = "";



        // Display students

        students.forEach(
            function(student) {

                addStudentToTable(student);

            }
        );


    }

    catch (error) {

        console.error(
            "Error loading students:",
            error
        );

        alert(
            "Unable to load students."
        );

    }

}



/* =========================================================
   ADD STUDENT TO TABLE
========================================================= */

function addStudentToTable(student) {


    const row =
        document.createElement("tr");



    row.innerHTML = `

        <td>${student.id}</td>

        <td>${student.name}</td>

        <td>${student.email}</td>

        <td>${student.phone}</td>

        <td>${student.course}</td>

        <td>${student.department}</td>

        <td>${student.year}</td>

        <td>

            <button
                class="edit-btn"
                onclick="editStudent(${student.id})">

                Edit

            </button>


            <button
                class="delete-btn"
                onclick="deleteStudent(${student.id})">

                Delete

            </button>

        </td>

    `;



    studentTable.appendChild(row);

}



/* =========================================================
   DELETE STUDENT
========================================================= */

async function deleteStudent(id) {


    const confirmDelete =
        confirm(
            "Are you sure you want to delete this student?"
        );



    if (!confirmDelete) {

        return;

    }



    try {


        // DELETE request

        const response =
            await fetch(
                `/api/students/${id}`,
                {
                    method: "DELETE"
                }
            );



        if (response.ok) {

            alert(
                "Student deleted successfully!"
            );

            loadStudents();

        }

        else {

            const data =
                await response.json();

            alert(
                data.error ||
                "Student not found"
            );

        }


    }

    catch (error) {

        console.error(
            "Delete error:",
            error
        );

        alert(
            "Unable to connect to Flask server."
        );

    }

}



/* =========================================================
   EDIT STUDENT
========================================================= */

async function editStudent(id) {


    try {


        // Get all students

        const response =
            await fetch("/api/students");


        const students =
            await response.json();



        // Find selected student

        const student =
            students.find(
                function(item) {

                    return item.id === id;

                }
            );



        if (!student) {

            alert(
                "Student not found"
            );

            return;

        }



        // Ask for new values

        const name =
            prompt(
                "Enter Student Name:",
                student.name
            );


        if (name === null) {

            return;

        }



        const email =
            prompt(
                "Enter Email:",
                student.email
            );


        if (email === null) {

            return;

        }



        const phone =
            prompt(
                "Enter Phone:",
                student.phone
            );


        if (phone === null) {

            return;

        }



        const course =
            prompt(
                "Enter Course:",
                student.course
            );


        if (course === null) {

            return;

        }



        const department =
            prompt(
                "Enter Department:",
                student.department
            );


        if (department === null) {

            return;

        }



        const year =
            prompt(
                "Enter Year:",
                student.year
            );


        if (year === null) {

            return;

        }



        // Updated student object

        const updatedStudent = {

            name: name,

            email: email,

            phone: phone,

            course: course,

            department: department,

            year: year

        };



        // PUT request

        const updateResponse =
            await fetch(
                `/api/students/${id}`,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            updatedStudent
                        )
                }
            );



        const data =
            await updateResponse.json();



        if (updateResponse.ok) {

            alert(
                "Student updated successfully!"
            );

            loadStudents();

        }

        else {

            alert(
                data.error ||
                "Failed to update student"
            );

        }


    }

    catch (error) {

        console.error(
            "Edit error:",
            error
        );

        alert(
            "Unable to connect to Flask server."
        );

    }

}



/* =========================================================
   SEARCH STUDENTS
========================================================= */

async function searchStudents() {


    const searchText =
        searchInput.value
        .trim()
        .toLowerCase();



    try {


        // Get students

        const response =
            await fetch("/api/students");


        const students =
            await response.json();



        // Clear table

        studentTable.innerHTML = "";



        // Filter students

        const filteredStudents =
            students.filter(
                function(student) {

                    return (

                        student.name
                            .toLowerCase()
                            .includes(searchText)

                        ||

                        student.email
                            .toLowerCase()
                            .includes(searchText)

                        ||

                        student.phone
                            .toLowerCase()
                            .includes(searchText)

                        ||

                        student.course
                            .toLowerCase()
                            .includes(searchText)

                        ||

                        student.department
                            .toLowerCase()
                            .includes(searchText)

                        ||

                        student.year
                            .toLowerCase()
                            .includes(searchText)

                    );

                }
            );



        // Display filtered students

        filteredStudents.forEach(
            function(student) {

                addStudentToTable(student);

            }
        );


    }

    catch (error) {

        console.error(
            "Search error:",
            error
        );

    }

}



/* =========================================================
   SEARCH WHILE TYPING
========================================================= */

searchInput.addEventListener(
    "input",
    function() {

        searchStudents();

    }
);



/* =========================================================
   LOAD STUDENTS WHEN PAGE OPENS
========================================================= */

loadStudents();


</script>


</body>

</html>
```
